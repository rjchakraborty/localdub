[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localdub"
version = "0.3.1"
description = "Local audio dubbing and review on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/rjchakraborty/localdub"
Repository = "https://github.com/rjchakraborty/localdub"
Issues = "https://github.com/rjchakraborty/localdub/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["dubbing/requirements.txt"]}

[tool.setuptools.packages.find]
include = ["dubbing", "dubbing.desktop"]

[tool.setuptools.package-data]
dubbing = ["index.html", "languages.json", "requirements*.txt"]
"dubbing.desktop" = ["App.swift", "render_icon.swift"]

[tool.pytest.ini_options]
testpaths = ["dubbing/tests"]
addopts = "-ra"
